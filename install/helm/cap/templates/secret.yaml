{{- if not .Values.secrets.existingSecret }}
{{- /*
  Generate secrets once, then REUSE them on every subsequent upgrade via lookup.
  Rotating DATABASE_ENCRYPTION_KEY would make previously-encrypted rows undecryptable;
  rotating MySQL/MinIO creds would lock the app out. So we pin on first creation.
*/ -}}
{{- $name := printf "%s-secrets" (include "cap.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $d := dict -}}
{{- if $existing -}}{{- $d = $existing.data -}}{{- end -}}

{{- $get := dict -}}
{{- /* helper: reuse existing (b64) value if present, else generate */ -}}
{{- $nextauth := (index $d "NEXTAUTH_SECRET" | default (randAlphaNum 48 | b64enc)) -}}
{{- $enckey := (index $d "DATABASE_ENCRYPTION_KEY" | default (sha256sum (randAlphaNum 32) | b64enc)) -}}
{{- $webhook := (index $d "MEDIA_SERVER_WEBHOOK_SECRET" | default (randAlphaNum 32 | b64enc)) -}}
{{- $mysqlRoot := (index $d "MYSQL_ROOT_PASSWORD" | default (randAlphaNum 28 | b64enc)) -}}
{{- $mysqlPass := (index $d "MYSQL_PASSWORD" | default (randAlphaNum 24 | b64enc)) -}}
{{- $minioUser := (index $d "MINIO_ROOT_USER" | default (printf "cap-%s" (randAlphaNum 12) | b64enc)) -}}
{{- $minioPass := (index $d "MINIO_ROOT_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
type: Opaque
data:
  NEXTAUTH_SECRET: {{ $nextauth }}
  DATABASE_ENCRYPTION_KEY: {{ $enckey }}
  MEDIA_SERVER_WEBHOOK_SECRET: {{ $webhook }}
  MYSQL_ROOT_PASSWORD: {{ $mysqlRoot }}
  MYSQL_PASSWORD: {{ $mysqlPass }}
  MINIO_ROOT_USER: {{ $minioUser }}
  MINIO_ROOT_PASSWORD: {{ $minioPass }}
{{- end }}
