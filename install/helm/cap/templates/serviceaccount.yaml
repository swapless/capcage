{{- $fullname := include "cap.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
# The tenant workloads need no Kubernetes API access — disable token automounting
# (least privilege; nothing in Cap talks to the API server).
automountServiceAccountToken: false
