# Profile: local kind cage.
# Only what differs from values.yaml for the constrained local target.

# cap-web's pinned tag (images.web.tag=mirrored-8ee4cbd) is set in the base
# values.yaml and shared by both targets. On kind we use a pinned TAG rather than a
# digest because `kind load` carries tags, not digest associations; mirror.sh pins
# by digest against a real registry.

# Persistence: leave storageClassName empty to use kind's default provisioner
# (rancher.io/local-path, StorageClass "standard"). Proves the "assume no
# specific StorageClass" default binds on a real cluster.
persistence:
  storageClassName: ""

# media-server has no public image and must be built from Cap source; enable it
# once its image is built and loaded (see supply-chain/mirror.sh).
mediaServer:
  enabled: false

# On kind we reach the app via `kubectl port-forward` (no ingress controller is
# installed on this target — see the ingress note in values.yaml).
ingress:
  enabled: false
  installController: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: false # no Prometheus Operator in the bare cage
