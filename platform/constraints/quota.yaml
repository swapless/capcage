# Resource governance for the tenant namespace — a real shared cluster is never
# unbounded. Forces every pod to declare requests/limits (LimitRange enforces
# presence) and caps total consumption (ResourceQuota). The install must fit.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cap-quota
  namespace: cap
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    pods: "20"
    persistentvolumeclaims: "6"
    requests.storage: 60Gi
    services: "10"
    count/jobs.batch: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cap-limits
  namespace: cap
spec:
  limits:
    # Every container must end up with requests+limits; these defaults apply if a
    # container omits them, and the min/max bracket rejects absurd values.
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      min:
        cpu: "10m"
        memory: 16Mi
      max:
        cpu: "2"
        memory: 2Gi
